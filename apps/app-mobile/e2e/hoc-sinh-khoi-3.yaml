# Hành trình học sinh khối 3 (cấp 1): đăng nhập bằng mật khẩu trên phiếu (không bị buộc đổi), mở bài bằng mã (lối phụ "Nhập mã"),
# học từng bước, bài chơi luyện tập bốn dạng câu (kiểm từng câu, bảng phản hồi), kết quả bằng sao và thẻ di sản, album, tiến độ.
# Biến: STUDENT_CODE, STUDENT_PASSWORD (mật khẩu trên phiếu), NEW_PASSWORD (chỉ dùng khi tài khoản cũ còn bị buộc đổi), LESSON_CODE.
appId: host.exp.exponent
env:
  SHOT_PREFIX: khoi3
---
- runFlow: chung/mo-app.yaml
- runFlow: chung/vao-hoc-sinh.yaml
- runFlow: chung/dang-nhap-cap-mot.yaml
# Mở đúng bài của dữ liệu thử bằng mã (bài thầy cô giao cũng hiện sẵn trên con đường).
- tapOn: "Nhập mã"
- tapOn: "Nhập mã thầy cô cho"
- inputText: ${LESSON_CODE}
- hideKeyboard
- tapOn: "Mở"
- extendedWaitUntil:
    visible: ".*bước 1 trên.*"
    timeout: 30000
- runFlow: chung/hoc-va-lam-bai-khoi-3.yaml
