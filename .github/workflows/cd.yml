name: CD

# Triển khai hai web: CI trên main đạt thì cập nhật môi trường demo (commit hỏng CI không được triển khai,
# kể cả khi chủ repo đẩy thẳng hoặc gộp vượt bảo vệ), gắn tag v* thì cập nhật bản phát hành (chủ repo duyệt) và tạo GitHub Release.
# Hai nơi chạy: máy demo QUANG-NHO (runner tự host, tắt bằng biến repo MAY_DEMO_DEPLOY=false) và máy chủ Google Cloud
# (bật bằng biến repo GCP_DEPLOY=true; ảnh "web" build với địa chỉ GCP_LEARNING_WEB_URL, GCP_ADMIN_WEB_URL, đẩy lên Artifact
# Registry, triển khai qua SSH đi qua IAP bằng script /opt/dsvhvn/bin/trien-khai.sh của repo backend).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ma_commit:
        description: Commit cần triển khai (bỏ trống thì lấy commit mới nhất của nhánh đã chọn)
        required: false
        default: ''
      noi_trien_khai:
        description: Nơi triển khai
        type: choice
        options: [ca-hai, may-demo, google-cloud]
        default: ca-hai

permissions:
  contents: read

concurrency:
  group: trien-khai-web
  cancel-in-progress: false

jobs:
  dong-goi:
    name: Đóng gói hai web
    # Sau CI: chỉ khi CI đạt trên commit của main trong chính repo này (không nhận lượt CI của Pull Request).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MA_COMMIT: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Lấy đúng commit CI vừa kiểm (main có thể đã có commit mới hơn).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Kiểm biến cấp repo cho bản build
        env:
          DEMO_LEARNING_WEB_URL: ${{ vars.DEMO_LEARNING_WEB_URL }}
          DEMO_ADMIN_WEB_URL: ${{ vars.DEMO_ADMIN_WEB_URL }}
        run: |
          # Thiếu địa chỉ thì bản build chạy lên sẽ báo lỗi cấu hình, nên dừng ngay ở đây.
          if [ -z "$DEMO_LEARNING_WEB_URL" ] || [ -z "$DEMO_ADMIN_WEB_URL" ]; then
            echo "::error::Chưa đặt biến repo DEMO_LEARNING_WEB_URL hoặc DEMO_ADMIN_WEB_URL (ví dụ http://localhost:8082 và http://localhost:8081)."
            exit 1
          fi

      - run: npm ci

      - name: Build hai web
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_LEARNING_WEB_URL: ${{ vars.DEMO_LEARNING_WEB_URL }}
          VITE_ADMIN_WEB_URL: ${{ vars.DEMO_ADMIN_WEB_URL }}
          VITE_ANDROID_APP_URL: ${{ vars.DEMO_ANDROID_APP_URL }}
          # Thư mục video giới thiệu trên Cloudinary (apps/video-gioi-thieu/scripts/tai-len-cloudinary.mjs); bỏ trống thì không hiện khung video.
          VITE_INTRO_VIDEO_BASE_URL: ${{ vars.DEMO_INTRO_VIDEO_BASE_URL }}
          VITE_VNPAY_SANDBOX_NOTE: 'true'
        run: |
          npm run build -w @dsvhvn/web-quan-tri
          npm run build -w @dsvhvn/web-hoc-tap

      - name: Thêm cấu hình IIS và tệp phiên bản vào từng gói
        run: |
          for web in web-quan-tri web-hoc-tap; do
            cp scripts/trien-khai/web.config "apps/$web/dist/web.config"
            {
              echo "commit=$MA_COMMIT"
              echo "ref=$GITHUB_REF_NAME"
              echo "lan-chay=$GITHUB_RUN_NUMBER"
              echo "gio-dong-goi=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "apps/$web/dist/phien-ban.txt"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: web-quan-tri
          path: apps/web-quan-tri/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: web-hoc-tap
          path: apps/web-hoc-tap/dist
          if-no-files-found: error

  trien-khai:
    name: Triển khai lên máy demo
    needs: dong-goi
    if: vars.MAY_DEMO_DEPLOY != 'false' && inputs.noi_trien_khai != 'google-cloud'
    runs-on: [self-hosted, windows, may-demo]
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'phat-hanh' || 'demo' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: web-quan-tri
          path: goi/web-quan-tri

      - uses: actions/download-artifact@v8
        with:
          name: web-hoc-tap
          path: goi/web-hoc-tap

      - name: Triển khai web quản trị
        shell: pwsh
        run: >
          ./scripts/trien-khai/trien-khai-web.ps1
          -ThuMucGoi "$env:GITHUB_WORKSPACE\goi\web-quan-tri"
          -Dich 'C:\dsvhvn\web-quan-tri'
          -KiemUrl 'http://localhost:8081/'

      - name: Triển khai web học tập
        shell: pwsh
        run: >
          ./scripts/trien-khai/trien-khai-web.ps1
          -ThuMucGoi "$env:GITHUB_WORKSPACE\goi\web-hoc-tap"
          -Dich 'C:\dsvhvn\web-hoc-tap'
          -KiemUrl 'http://localhost:8082/'

  anh-google-cloud:
    name: Build ảnh web cho Google Cloud
    if: >-
      vars.GCP_DEPLOY == 'true' && inputs.noi_trien_khai != 'may-demo' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      MA_COMMIT: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
      GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
    steps:
      - name: Kiểm biến cấp repo cho bản build
        env:
          GCP_LEARNING_WEB_URL: ${{ vars.GCP_LEARNING_WEB_URL }}
          GCP_ADMIN_WEB_URL: ${{ vars.GCP_ADMIN_WEB_URL }}
        run: |
          if [ -z "$GCP_LEARNING_WEB_URL" ] || [ -z "$GCP_ADMIN_WEB_URL" ]; then
            echo "::error::Chưa đặt biến repo GCP_LEARNING_WEB_URL hoặc GCP_ADMIN_WEB_URL (tao-ha-tang.ps1 -DatBienGitHub đặt sẵn)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Đăng nhập Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGISTRY%%/*}" --quiet

      - uses: docker/setup-buildx-action@v4

      # Ảnh gắn mã commit; máy chủ ghi mã ảnh đang chạy để trả bản trước khi lần sau hỏng.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGISTRY }}/web:${{ env.MA_COMMIT }}
          labels: org.opencontainers.image.revision=${{ env.MA_COMMIT }}
          build-args: |
            VITE_LEARNING_WEB_URL=${{ vars.GCP_LEARNING_WEB_URL }}
            VITE_ADMIN_WEB_URL=${{ vars.GCP_ADMIN_WEB_URL }}
            VITE_ANDROID_APP_URL=${{ vars.GCP_ANDROID_APP_URL }}
            VITE_INTRO_VIDEO_BASE_URL=${{ vars.DEMO_INTRO_VIDEO_BASE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  trien-khai-google-cloud:
    name: Triển khai lên Google Cloud
    needs: anh-google-cloud
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'phat-hanh' || 'google-cloud' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MA_COMMIT: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
      GCP_VM: ${{ vars.GCP_VM }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      # Kéo ảnh, chạy bản mới, kiểm hai web, hỏng thì tự trả bản trước. Khóa SSH sinh cho lượt chạy này, hết hạn sau 30 phút.
      - name: Triển khai qua SSH
        run: >
          gcloud compute ssh "$GCP_VM" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          --ssh-key-expire-after=30m --strict-host-key-checking=no
          --command "sudo /opt/dsvhvn/bin/trien-khai.sh web ${MA_COMMIT}"

  phat-hanh:
    name: Tạo bản phát hành
    needs: [dong-goi, trien-khai]
    # Máy demo tắt (MAY_DEMO_DEPLOY=false) thì vẫn phát hành từ gói đã đóng.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.dong-goi.result == 'success' && needs.trien-khai.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-quan-tri
          path: goi/web-quan-tri

      - uses: actions/download-artifact@v8
        with:
          name: web-hoc-tap
          path: goi/web-hoc-tap

      - name: Nén hai web
        run: |
          mkdir -p ra
          (cd goi/web-quan-tri && zip -qr "$GITHUB_WORKSPACE/ra/dsvhvn-web-quan-tri-$GITHUB_REF_NAME.zip" .)
          (cd goi/web-hoc-tap && zip -qr "$GITHUB_WORKSPACE/ra/dsvhvn-web-hoc-tap-$GITHUB_REF_NAME.zip" .)
          ls -l ra

      - name: Tạo hoặc cập nhật Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ra/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" ra/*.zip --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
