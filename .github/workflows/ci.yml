name: CI

# Nhánh việc chỉ chạy CI qua Pull Request (mở ở dạng nháp nếu chưa xong): chạy thêm lượt push cho cùng commit thì
# hai lượt cùng tên kiểm tra, một lượt hỏng ngẫu nhiên cũng chặn gộp.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Một lần chạy mới trên cùng nhánh sẽ hủy lần chạy cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hai web và gói dùng chung (npm workspaces ở thư mục gốc).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:tokens
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Chỉ báo lỗ hổng, không làm hỏng lần chạy.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # App mobile: có package-lock.json riêng, không thuộc workspaces.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/app-mobile/package-lock.json
      # Mã dùng chung ở packages/dung-chung tìm phụ thuộc (vd. @babel/runtime) và oxlint
      # từ node_modules ở gốc, nên cần cài cả gốc lẫn app mobile.
      - name: Cài phụ thuộc ở gốc
        working-directory: .
        run: npm ci
      - name: Cài phụ thuộc của app mobile
        run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Không được để mã quảng cáo thật trong mã nguồn; chỉ nhà xuất bản thử của Google được phép.
      - name: Kiểm không có mã quảng cáo thật
        working-directory: .
        run: |
          kq=$(git grep -nE 'ca-app-pub-[0-9]{16}[~/][0-9]{10}' -- . ':!*.md' || true)
          that=$(printf '%s\n' "$kq" | grep -v '3940256099942544' | grep -v '^$' || true)
          if [ -n "$that" ]; then
            echo "Có mã quảng cáo thật trong mã nguồn:"
            echo "$that"
            exit 1
          fi
          echo "Không có mã quảng cáo thật."

  # Ảnh "web" cho máy chủ Google Cloud: build hai web trong Docker, chạy thử Caddy bên trong ảnh (trang chủ, đường dẫn của ứng
  # dụng một trang trả index.html, tệp thiếu trong assets trả 404, cache, kiểu nội dung phụ đề).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ảnh web
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dsvhvn-ci/web:ci
          build-args: |
            VITE_LEARNING_WEB_URL=https://203.0.113.7
            VITE_ADMIN_WEB_URL=https://203.0.113.7:8443
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Chạy thử Caddy trong ảnh
        run: |
          set -euo pipefail
          docker run -d --name web -p 127.0.0.1:8080:8080 -p 127.0.0.1:8081:8081 dsvhvn-ci/web:ci
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          kiem() { # địa chỉ, mã mong đợi, chuỗi phải có trong tiêu đề hoặc nội dung
            dau=$(curl -s -D - -o "$RUNNER_TEMP/than" "$1")
            ma=$(printf '%s' "$dau" | head -n 1 | cut -d' ' -f2)
            echo "$1 -> $ma"
            test "$ma" = "$2"
            if [ -n "${3:-}" ]; then printf '%s\n' "$dau" | cat - "$RUNNER_TEMP/than" | grep -qi -- "$3"; fi
          }
          kiem http://127.0.0.1:8080/ 200 'cache-control: no-cache'
          kiem http://127.0.0.1:8080/di-san/hoang-thanh-thang-long 200 '<div id="root">'
          kiem http://127.0.0.1:8081/ 200 '<div id="root">'
          kiem http://127.0.0.1:8081/truong/ket-qua-thanh-toan 200 '<div id="root">'
          kiem http://127.0.0.1:8080/assets/khong-co.js 404
          tep=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          kiem "http://127.0.0.1:8080$tep" 200 'immutable'
          kiem http://127.0.0.1:8080/video/du-khach-60s.en.vtt 200 'content-type: text/vtt'
          kiem http://127.0.0.1:8080/ 200 'x-content-type-options: nosniff'
          # Địa chỉ web quản trị gắn vào bản build của web học tập.
          docker exec web grep -rlq 'https://203.0.113.7:8443' /srv/web-hoc-tap/assets
      - name: Nhật ký container khi hỏng
        if: failure()
        run: docker logs web

  # Quét ký hiệu viết tắt nội bộ trong mã, commit message và tên nhánh.
  ky-hieu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Quét ký hiệu
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: python .github/scripts/kiem-ky-hieu.py --base "origin/$BASE_REF"
